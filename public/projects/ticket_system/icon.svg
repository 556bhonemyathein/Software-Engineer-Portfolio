<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
    <mask id="ticketMask">
      <!-- Full ticket rectangle -->
      <rect x="0" y="0" width="260" height="340" rx="28" ry="28" fill="#FFFFFF"/>
      <!-- Left notch -->
      <circle cx="0" cy="220" r="24" fill="#000000"/>
      <!-- Right notch -->
      <circle cx="260" cy="220" r="24" fill="#000000"/>
    </mask>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Centered & tilted ticket -->
  <g transform="translate(256, 256) rotate(-14) translate(-130, -170)" filter="url(#dropShadow)">
    <!-- Ticket Body with Notches -->
    <rect x="0" y="0" width="260" height="340" fill="url(#ticketGrad)" mask="url(#ticketMask)"/>

    <!-- Perforation dashed line -->
    <line x1="28" y1="220" x2="232" y2="220" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8,6"/>

    <!-- Airplane Icon -->
    <g transform="translate(130, 110) scale(1.15)">
      <path d="M0 -65 L14 -20 L75 0 L75 14 L14 6 L14 44 L34 58 L34 68 L0 60 L-34 68 L-34 58 L-14 44 L-14 6 L-75 14 L-75 0 L-14 -20 Z" fill="#1D4ED8"/>
    </g>

    <!-- Flight route dots -->
    <circle cx="50" cy="180" r="5" fill="#3B82F6"/>
    <line x1="62" y1="180" x2="198" y2="180" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="210" cy="180" r="5" fill="#2563EB"/>

    <!-- Barcode strips -->
    <g transform="translate(40, 245)" fill="#1E293B">
      <rect x="0" y="0" width="6" height="55"/>
      <rect x="10" y="0" width="4" height="55"/>
      <rect x="18" y="0" width="10" height="55"/>
      <rect x="34" y="0" width="4" height="55"/>
      <rect x="42" y="0" width="8" height="55"/>
      <rect x="56" y="0" width="14" height="55"/>
      <rect x="74" y="0" width="4" height="55"/>
      <rect x="84" y="0" width="8" height="55"/>
      <rect x="98" y="0" width="12" height="55"/>
      <rect x="116" y="0" width="6" height="55"/>
      <rect x="126" y="0" width="4" height="55"/>
      <rect x="136" y="0" width="10" height="55"/>
      <rect x="152" y="0" width="6" height="55"/>
      <rect x="164" y="0" width="12" height="55"/>
    </g>
  </g>
</svg>

